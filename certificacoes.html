<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Certificações</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 30px 0;
        }

        .certificados-container img {
            width: 450px;
            height: 620px;
            object-fit: contain;
            border-radius: 15px;
            border: 3px solid #7c3aed;
            box-shadow: 0 0 20px rgba(124,58,237,0.5);
            opacity: 0;
        }

        .certificados-container {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 40px;
        }

        .certificado {
            width: 400px;
            cursor: pointer;
            border-radius: 12px;
            border: 3px solid #7c3aed;
        }

        .certificados-container img:hover {
            transform: scale(1.03);
            transition: all 0.3s ease;
        }

        .btn-voltar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .certificados-container img:first-child {
            opacity: 0;
            animation: aparecer 1s forwards;
        }

        .certificados-container img:last-child {
            opacity: 0;
            animation: aparecer 1s forwards;
            animation-delay: 3s;
        }

        .btn-voltar {
            box-shadow: 0 0 15px rgba(124,58,237,.5);
        }

        #az900 {
            display: none;
        }

        .titulo-certificacoes {
            color: white;
            font-size: 4rem;
            font-weight: 700;
            text-align: center;
            margin-top: 30px;
            text-shadow: 0 0 20px rgba(124,58,237,.7);
        }

        .subtitulo-certificacoes {
            color: #bdbdbd;
            font-size: 1.2rem;
            text-align: center;
            margin-top: -15px;
            margin-bottom: 50px;
        }

        .linha-certificacao {
            width: 300px;
            height: 4px;
            margin: 20px auto 50px auto;
            background: linear-gradient( 90deg, transparent, #7c3aed, transparent );
            border-radius: 10px;
        }


        @keyframes aparecer {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        ``

        @keyframes aparecer2 {
            from {
                opacity: 0;
                visibility: hidden;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
        }


    </style>
</head>

<body>

    <button onclick="history.back()" class="btn-voltar">
        ← Voltar
    </button>

    <h1 class="titulo-certificacoes">
        🏆 Minhas Certificações
    </h1>

    <p class="subtitulo-certificacoes">
        Certificações obtidas em Infraestrutura, Monitoramento e Cloud Computing.
    </p>

    <div class="linha-certificacao"></div>

    <div class="certificados-container">

        <a href="certificados/zabbix.pdf" target="_blank">
            <img src="certificate_page-0001.jpg" alt="Certificação Zabbix" class="certificado">
        </a>

        <a href="certificados/az900.pdf" target="_blank">
            <img src="az900.jpg"
                 alt="Certificação AZ-900"
                 class="certificado"
                 id="az900">
        </a>

    </div>

    <script>

setTimeout(() => {
                            document.getElementById("az900").style.display = "block";
}, 1000);

    </script>

</body>
</html>
